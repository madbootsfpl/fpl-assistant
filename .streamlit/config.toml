# Streamlit config for the deploy (and local runs) — ADR-053.
[server]
headless = true          # no auto-open a browser (also the Community Cloud default)

[browser]
gatherUsageStats = false  # don't phone home

# NOTE (ADR-114 reverted, 2026-08-17): a `[theme]` block was tried (primaryColor = MADBOOTS purple) but **any**
# `[theme]` in config.toml *pins* the theme — `base` defaults to light, so it forced **light-only** and removed the
# user's Light/Dark/System toggle. Theme-following matters more than a purple accent, so it's removed. The brand
# purple stays where we control it directly (the cards/banners via `brand.token_css_vars()`), not the widget theme.
