name: CI

# Run the linter and the (offline) test suite on every push and pull request.
# The tests make no network calls — they use fakes and an in-memory DB — so CI is
# fast and deterministic (US-079, Sprint 026).

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]   # 3.14 is the dev version; 3.13 for breadth

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

  # ⭐ The dual-backend claim, swept rather than asserted (ADR-184's discipline, ADR-211's requirement).
  # `Storage` holds one body of SQL and must run on both engines; a claim nothing re-checks is a claim that
  # rots. This runs the SAME suite against a real Postgres — the 13 SQLite-legacy migration/reseed tests skip
  # themselves, and `test_storage_backends.py` pins which 13 those are so the list cannot quietly grow.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: madboots_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests (pytest, Postgres backend)
        env:
          MADBOOTS_TEST_DSN: postgresql://postgres:postgres@localhost:5432/madboots_test
        run: pytest -q
