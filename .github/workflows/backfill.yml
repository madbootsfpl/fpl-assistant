name: Gameweek backfill

# The per-gameweek history walk (ADR-211, Phase 2d) — a different job on a different clock from the core
# refresh in `data.yml`.
#
# ⭐ **Rare and expensive, where the refresh is frequent and cheap.** One throttled request per player
# (~659, three to five minutes) against the refresh's 3.6 seconds; needed once per gameweek, after the
# results post. So it ticks hourly and `app.py pipeline --backfill` exits immediately unless a **completed**
# gameweek has no stored history — which is why it is not folded into the 15-minute tick: a five-minute job
# has no business holding that concurrency group.
#
# ⚠️ Inert until FPL_DATABASE_URL is set, like the others.

on:
  schedule:
    - cron: "40 * * * *"       # hourly, off the top of the hour so it never collides with the :00 refresh
  workflow_dispatch:
    inputs:
      force:
        description: "Walk the players even if no gameweek looks missing"
        type: boolean
        default: false

concurrency:
  group: gameweek-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Throttled at 0.3s per player, so the floor is ~3.3 minutes; this is a ceiling for a bad network, not a
    # target. Well under the 6h default, but stated so a hung run is killed rather than burning minutes.
    timeout-minutes: 30
    steps:
      - name: Is the pipeline configured?
        id: gate
        env:
          FPL_DATABASE_URL: ${{ secrets.FPL_DATABASE_URL }}
        run: |
          if [ -z "$FPL_DATABASE_URL" ]; then
            echo "No FPL_DATABASE_URL secret — nothing to do."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.configured == 'true'

      - name: Set up Python
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.configured == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Backfill if a gameweek is missing
        if: steps.gate.outputs.configured == 'true'
        env:
          FPL_DATABASE_URL: ${{ secrets.FPL_DATABASE_URL }}
        run: |
          python app.py pipeline --backfill ${{ inputs.force && '--force' || '' }}
